name: proba_output
on:
  push:
    paths:
      - '.github/workflows/proba_output.yml'
jobs:
  proba:
    runs-on: ubuntu-latest
    steps:
      - name: Sciezka pliku GITHUB_OUTPUT
        run: echo "GITHUB_OUTPUT=$GITHUB_OUTPUT"

      - name: Jeden wiersz ze spacjami
        id: jeden
        run: |
          JADRO=$(uname -a)
          echo "JADRO=$JADRO" >> $GITHUB_OUTPUT
          echo "--- zawartosc pliku:"
          cat "$GITHUB_OUTPUT"

      - name: Odczyt wyniku
        run: echo "Jadro w systemie to $W"
        env:
          W: ${{ steps.jeden.outputs.JADRO }}

      - name: Zapis do GITHUB_ENV
        run: echo "JADRO2=$(uname -r)" >> $GITHUB_ENV

      - name: Odczyt GITHUB_ENV
        run: echo "JADRO2=$JADRO2"

      - name: Plik do skrotu
        run: |
          mkdir -p downloads
          echo "https://www.netfilter.org/projects/nftables/files/nftables-1.0.6.1.tar.xz" > downloads/nftables.url
          sha256sum downloads/nftables.url

      - name: hashFiles
        run: echo "hashFiles=${{ hashFiles('downloads/nftables.url') }} brak=[${{ hashFiles('downloads/nie_ma.url') }}]"

      - name: Wiele wierszy bez ogranicznika
        id: wiele
        continue-on-error: true
        run: echo "LISTA=$(printf 'a\nb')" >> $GITHUB_OUTPUT

      - name: Po bledzie
        run: echo "wiele.outcome=${{ steps.wiele.outcome }} wiele.conclusion=${{ steps.wiele.conclusion }}"
